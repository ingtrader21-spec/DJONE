name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r services/api/requirements.txt
      - run: PYTHONPATH=services/api pytest -q
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -t djone-api:test services/api
      - run: docker build -t djone-mixxx-bridge:test services/mixxx-bridge
      - run: |
          DJONE_API_TOKEN=test-api BRIDGE_TOKEN=test-bridge POSTGRES_PASSWORD=test-db docker compose up -d --build
          for i in {1..30}; do curl -fsS http://127.0.0.1:8090/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8090/ready
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
