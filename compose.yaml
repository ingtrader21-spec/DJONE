services:
  api:
    build: ./services/api
    environment:
      DJONE_ENV: ${DJONE_ENV:-development}
      DJONE_MODE: ${DJONE_MODE:-assistant}
      DJONE_API_TOKEN: ${DJONE_API_TOKEN:-}
      DATABASE_URL: postgresql://djone:${POSTGRES_PASSWORD:-djone}@postgres:5432/djone
      REDIS_URL: redis://redis:6379/0
      BRIDGE_URL: http://mixxx-bridge:8091
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
    ports: ["127.0.0.1:${DJONE_HTTP_PORT:-8092}:8090"]
    volumes:
      - ${DJONE_MUSIC_DIR:-/home/codestra/Music/DJONE}:/music:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mixxx-bridge: { condition: service_healthy }
    restart: unless-stopped
  mixxx-bridge:
    build: ./services/mixxx-bridge
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      DJONE_MIXXX_TOKEN: ${DJONE_MIXXX_TOKEN:-}
      DJONE_MIXXX_HOST: 172.21.0.1
      DJONE_MIXXX_PORT: 18092
      DATABASE_URL: postgresql://djone:${POSTGRES_PASSWORD:-djone}@postgres:5432/djone
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  webhook-worker:
    build: ./services/api
    command: ["python","-m","app.webhook_worker"]
    environment:
      DATABASE_URL: postgresql://djone:${POSTGRES_PASSWORD:-djone}@postgres:5432/djone
      WEBHOOK_MAX_ATTEMPTS: 6
      WEBHOOK_POLL_SECONDS: 2
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: djone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djone}
      POSTGRES_DB: djone
    volumes:
      - djone_pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U djone -d djone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [djone_redis:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  djone_pg:
  djone_redis:
