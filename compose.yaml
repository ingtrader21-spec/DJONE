services:
  api:
    build: ./services/api
    environment:
      DJONE_MODE: ${DJONE_MODE:-assistant}
      DATABASE_URL: postgresql://djone:${POSTGRES_PASSWORD:-djone}@postgres:5432/djone
      REDIS_URL: redis://redis:6379/0
    ports: ["8090:8090"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: djone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djone}
      POSTGRES_DB: djone
    volumes: [djone_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U djone -d djone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [djone_redis:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  djone_pg:
  djone_redis:
